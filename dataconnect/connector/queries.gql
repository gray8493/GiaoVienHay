}

# ==================== 11. NOTIFICATION QUERIES ====================

query ListNotificationsByRecipient($recipientId: String!) @auth(level: NO_ACCESS) {
  notifications(
    where: {
      recipientId: { eq: $recipientId }
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    recipientId
    title
    body
    type
    isRead
    createdAt
  }
}

# ==================== 12. SYSTEM LIMIT QUERIES ====================

query GetSystemLimits @auth(level: NO_ACCESS) {
  systemLimits(limit: 1) {
    id
    geminiQuotaPerTeacher
    maxQuizQuestions
    maxUploadSizeMb
    maxStudentsPerClass
    maxClassesPerTeacher
    aiModel
    allowSubjectTeacherCreateClass
    enableFallbackCache
    updatedAt
  }
}
