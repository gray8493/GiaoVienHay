# Các câu truy vấn dữ liệu SQL quan hệ cho Firebase Data Connect

# ==================== 1. USER QUERIES ====================

query ListUsers($role: String, $isActive: Boolean) @auth(level: NO_ACCESS) {
  users(
    where: {
      role: { eq: $role }
      isActive: { eq: $isActive }
      isDeleted: { eq: false }
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    code
    fullName
    phone
    email
    role
    schoolName
    assignedInfo
    isActive
    aiDailyQuota
    aiUsedToday
    aiModelTier
    createdAt
  }
}

query GetUserById($id: String!) @auth(level: NO_ACCESS) {
  user(id: $id) {
    id
    code
    fullName
    phone
    email
    role
    schoolName
    assignedInfo
    isActive
    aiDailyQuota
    aiUsedToday
    aiModelTier
    createdAt
  }
}

query GetUserByPhone($phone: String!) @auth(level: NO_ACCESS) {
  users(
    where: {
      phone: { eq: $phone }
      isDeleted: { eq: false }
    }
    limit: 1
  ) {
    id
    code
    fullName
    phone
    email
    role
    schoolName
    assignedInfo
    isActive
    aiDailyQuota
    aiUsedToday
    aiModelTier
    createdAt
  }
}

# ==================== 2. SCHOOL QUERIES ====================

query ListSchools @auth(level: NO_ACCESS) {
  schools(orderBy: [{ name: ASC }]) {
    id
    code
    name
    address
    phone
    email
    createdAt
  }
}

# ==================== 3. CLASS QUERIES ====================

query ListClasses($schoolName: String) @auth(level: NO_ACCESS) {
  classes(
    where: {
      schoolName: { eq: $schoolName }
      isDeleted: { eq: false }
    }
    orderBy: [{ gradeLevel: ASC }]
  ) {
    id
    name
    gradeLevel
    academicYear
    schoolName
    homeroomTeacherId
    inviteCode
    studentCount
    createdAt
  }
}

query GetClassById($id: String!) @auth(level: NO_ACCESS) {
  class(id: $id) {
    id
    name
    gradeLevel
    academicYear
    schoolName
    homeroomTeacherId
    inviteCode
    studentCount
    createdAt
  }
}

query ListClassesByTeacher($teacherId: String!) @auth(level: NO_ACCESS) {
  classes(
    where: {
      homeroomTeacherId: { eq: $teacherId }
      isDeleted: { eq: false }
    }
    orderBy: [{ gradeLevel: ASC }]
  ) {
    id
    name
    gradeLevel
    academicYear
    schoolName
    homeroomTeacherId
    inviteCode
    studentCount
    createdAt
  }
}

# ==================== 4. STUDENT QUERIES ====================

query ListStudentsByClass($classId: String!) @auth(level: NO_ACCESS) {
  students(
    where: {
      classId: { eq: $classId }
      isDeleted: { eq: false }
    }
    orderBy: [{ fullName: ASC }]
  ) {
    id
    classId
    studentCode
    fullName
    dob
    gender
    parentPhone
    createdAt
  }
}

query GetStudentById($id: String!) @auth(level: NO_ACCESS) {
  student(id: $id) {
    id
    classId
    studentCode
    fullName
    dob
    gender
    parentPhone
    createdAt
  }
}

# ==================== 5. ATTENDANCE QUERIES ====================

query GetAttendanceByClassDate($classId: String!, $date: String!) @auth(level: NO_ACCESS) {
  attendances(
    where: {
      classId: { eq: $classId }
      date: { eq: $date }
    }
  ) {
    id
    classId
    studentId
    date
    status
    note
    createdAt
  }
}

query GetAttendanceByStudent($studentId: String!) @auth(level: NO_ACCESS) {
  attendances(
    where: {
      studentId: { eq: $studentId }
    }
    orderBy: [{ date: DESC }]
  ) {
    id
    classId
    studentId
    date
    status
    note
    createdAt
  }
}

# ==================== 6. SCORE QUERIES ====================

query GetScoresByStudent($studentId: String!, $term: Int, $academicYear: String) @auth(level: NO_ACCESS) {
  scores(
    where: {
      studentId: { eq: $studentId }
      term: { eq: $term }
      academicYear: { eq: $academicYear }
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    studentId
    classId
    subject
    scoreType
    scoreValue
    term
    academicYear
    createdAt
  }
}

query GetScoresByClassSubject($classId: String!, $subject: String!) @auth(level: NO_ACCESS) {
  scores(
    where: {
      classId: { eq: $classId }
      subject: { eq: $subject }
    }
  ) {
    id
    studentId
    classId
    subject
    scoreType
    scoreValue
    term
    academicYear
    createdAt
  }
}

