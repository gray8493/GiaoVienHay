# ==================== 10. FEE QUERIES ====================

query ListFeesByStudent($studentId: String!) @auth(level: NO_ACCESS) {
  fees(
    where: {
      studentId: { eq: $studentId }
    }
    orderBy: [{ dueDate: DESC }]
  ) {
    id
    studentId
    title
    amount
    status
    dueDate
    paidAt
