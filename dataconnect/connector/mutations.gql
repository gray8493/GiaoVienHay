# Các thao tác thêm, sửa, xóa dữ liệu quan hệ SQL cho Firebase Data Connect

# ==================== 1. USER MUTATIONS ====================

mutation CreateUser(
  $id: String!
  $code: String!
  $fullName: String!
  $phone: String!
  $email: String
  $role: String!
  $schoolName: String
  $assignedInfo: String
  $aiDailyQuota: Int
  $aiModelTier: String
) @auth(level: NO_ACCESS) {
  user_insert(
    data: {
      id: $id
      code: $code
      fullName: $fullName
      phone: $phone
      email: $email
      role: $role
      schoolName: $schoolName
      assignedInfo: $assignedInfo
      aiDailyQuota: $aiDailyQuota
      aiModelTier: $aiModelTier
    }
  )
}

mutation UpdateTeacherAiQuota(
  $id: String!
  $aiDailyQuota: Int!
  $aiModelTier: String
  $aiUsedToday: Int
) @auth(level: NO_ACCESS) {
  user_update(
    id: $id
    data: {
      aiDailyQuota: $aiDailyQuota
      aiModelTier: $aiModelTier
      aiUsedToday: $aiUsedToday
    }
  )
}

mutation UpdateAdminUser(
  $id: String!
  $fullName: String
  $phone: String
  $email: String
  $role: String
  $schoolName: String
) @auth(level: NO_ACCESS) {
  user_update(
    id: $id
    data: {
      fullName: $fullName
      phone: $phone
      email: $email
      role: $role
      schoolName: $schoolName
    }
  )
}

mutation UpdateUserStatus(
  $id: String!
  $isActive: Boolean!
) @auth(level: NO_ACCESS) {
  user_update(
    id: $id
    data: {
      isActive: $isActive
    }
  )
}

mutation SoftDeleteUser($id: String!) @auth(level: NO_ACCESS) {
  user_update(
    id: $id
    data: {
      isDeleted: true
    }
  )
}

