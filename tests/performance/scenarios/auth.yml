# ============================================================
# GiaoVienHay - Scenario: Auth API Performance
# Kiểm thử hiệu năng nhóm API xác thực:
#   POST /auth/login
#   POST /auth/register
#   POST /auth/refresh-token
#   POST /auth/change-password
#   POST /auth/logout
# ============================================================

config:
  target: "http://localhost:3000"
  plugins:
    expect: {}
  processor: "../helpers/auth.js"
  defaults:
    headers:
      Content-Type: "application/json"
      Accept: "application/json"

  # Chạy riêng file này: artillery run tests/performance/scenarios/auth.yml --env smoke
  environments:
    smoke:
      phases:
        - duration: 30
          arrivalRate: 1
          name: "Smoke - Auth"

    load:
      phases:
        - duration: 60
          arrivalRate: 5
          rampTo: 30
          name: "Ramp Up - Auth"
        - duration: 120
          arrivalRate: 30
          name: "Sustained - Auth"

    stress:
      phases:
        - duration: 60
          arrivalRate: 10
          rampTo: 100
          name: "Stress - Auth"
        - duration: 120
          arrivalRate: 100
          name: "Peak - Auth"

  ensure:
    thresholds:
      - http.response_time.p95: 1500   # Auth phải phản hồi < 1.5s ở p95
      - http.response_time.p99: 3000   # p99 < 3s

# ---- Biến test ----
# Danh sách SĐT đa dạng để tránh bottleneck trên cùng 1 tài khoản
variables:
  testPhones:
    - "0901234567"
    - "0912345678"
    - "0923456789"

scenarios:
  # TC-AUTH-01: Đăng nhập thành công với tài khoản giáo viên
  - name: "PT-AUTH-01: Login Teacher - Happy Path"
    weight: 50
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            phone: "0909999999"
            password: "Password@123"
          capture:
            - json: "$.data.access_token"
              as: "accessToken"
            - json: "$.data.refresh_token"
              as: "refreshToken"
          expect:
            - statusCode: 200
            - hasProperty: "data.access_token"
            - hasProperty: "data.refresh_token"
      # Dùng luôn token vừa lấy để test refresh
      - think: 0.5
      - post:
          url: "/api/v1/auth/refresh-token"
          json:
            refresh_token: "{{ refreshToken }}"
          expect:
            - statusCode:
                - 200
                - 401

  # TC-AUTH-02: Đăng nhập sai mật khẩu (stress lên /auth/login)
  - name: "PT-AUTH-02: Login Wrong Password - Error Path"
    weight: 20
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            phone: "0901234567"
            password: "WrongPassword999"
          expect:
            - statusCode:
                - 401
                - 400

  # TC-AUTH-03: Đăng nhập thiếu trường bắt buộc (validation)
  - name: "PT-AUTH-03: Login Missing Fields - Validation"
    weight: 10
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            phone: "0901234567"
          expect:
            - statusCode: 400

  # TC-AUTH-04: Refresh token hợp lệ
  - name: "PT-AUTH-04: Refresh Token"
    weight: 10
    flow:
      - function: "loginAndGetToken"
      - post:
          url: "/api/v1/auth/refresh-token"
          json:
            refresh_token: "{{ authToken }}"
          expect:
            - statusCode:
                - 200
                - 401

  # TC-AUTH-05: Đổi mật khẩu (yêu cầu xác thực)
  - name: "PT-AUTH-05: Change Password"
    weight: 5
    flow:
      - function: "loginAndGetToken"
      - post:
          url: "/api/v1/auth/change-password"
          headers:
            Authorization: "Bearer {{ authToken }}"
          json:
            old_password: "Test@123456"
            new_password: "Test@123456"
          expect:
            - statusCode:
                - 200
                - 400
                - 401

  # TC-AUTH-06: Logout
  - name: "PT-AUTH-06: Logout"
    weight: 5
    flow:
      - function: "loginAndGetToken"
      - post:
          url: "/api/v1/auth/logout"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode:
                - 200
                - 401
