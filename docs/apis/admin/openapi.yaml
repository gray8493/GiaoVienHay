openapi: 3.0.3
info:
  title: GiaoVienHay - Platform Admin API
  description: Đặc tả OpenAPI cho Cổng Quản trị Nền tảng (Dành riêng Web Next.js Admin Portal)
  version: 1.0.0
servers:
  - url: https://api.giaovienhay.vn/api/v1
    description: Production Server
  - url: http://localhost:3000/api/v1
    description: Local Dev Server

tags:
  - name: Admin Users
    description: CRUD danh sách tài khoản & Khóa/Mở khóa tài khoản (Ban/Unban)
  - name: Admin Monitoring
    description: Giám sát dữ liệu lớp học toàn nền tảng
  - name: Admin System Limits
    description: Cấu hình hạn mức tài nguyên và hạn ngạch AI Gemini

paths:
  /admin/users:
    get:
      tags:
        - Admin Users
      summary: Danh sách người dùng toàn hệ thống (Phân trang & Lọc)
      operationId: getAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [TEACHER_HOMEROOM, TEACHER_SUBJECT, PARENT]
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 1200
                      page:
                        type: integer
                        example: 1
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminUserItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}:
    get:
      tags:
        - Admin Users
      summary: Xem chi tiết thông tin và hồ sơ người dùng
      operationId: getAdminUserDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lấy thông tin chi tiết người dùng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminUserItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/status:
    patch:
      tags:
        - Admin Users
      summary: Khóa hoặc kích hoạt lại tài khoản người dùng (Chuẩn hóa gộp ban/unban)
      operationId: updateUserStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
                  example: false
                reason:
                  type: string
                  example: "Vi phạm quy tắc bảo mật hệ thống"
      responses:
        '200':
          description: Cập nhật trạng thái người dùng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật trạng thái người dùng thành công"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/dashboard/stats:
    get:
      tags:
        - Admin Monitoring
      summary: Thống kê tổng quan nền tảng cho Dashboard Web Next.js
      description: Thống kê tổng số giáo viên, phụ huynh, lớp học, học sinh và lượt sử dụng AI Gemini trong ngày.
      operationId: getAdminDashboardStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy số liệu thống kê thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total_teachers:
                        type: integer
                        example: 350
                      total_parents:
                        type: integer
                        example: 4500
                      total_classes:
                        type: integer
                        example: 120
                      total_students:
                        type: integer
                        example: 4200
                      ai_calls_today:
                        type: integer
                        example: 850
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/ban:
    patch:
      tags:
        - Admin Users
      summary: Khóa tài khoản người dùng vi phạm chính sách
      operationId: banUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Vi phạm chia sẻ tài liệu sai quy định
                note:
                  type: string
      responses:
        '200':
          description: Khóa tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã khóa tài khoản người dùng thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/unban:
    patch:
      tags:
        - Admin Users
      summary: Mở khóa tài khoản người dùng
      operationId: unbanUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mở khóa tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã mở khóa tài khoản thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/classes:
    get:
      tags:
        - Admin Monitoring
      summary: Giám sát toàn bộ lớp học trên hệ thống
      operationId: getAdminClasses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy danh sách lớp học thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/system/limits:
    get:
      tags:
        - Admin System Limits
      summary: Lấy cấu hình hạn ngạch tài nguyên hiện tại
      operationId: getSystemLimits
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy cấu hình thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLimitsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin System Limits
      summary: Cập nhật hạn mức tài nguyên và hạn ngạch AI toàn hệ thống
      operationId: updateSystemLimits
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemLimitsDto'
      responses:
        '200':
          description: Cập nhật cấu hình thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AdminUserItem:
      type: object
      properties:
        uid:
          type: string
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        school_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    SystemLimitsDto:
      type: object
      required:
        - max_classes_per_teacher
        - max_students_per_class
        - gemini_ai_daily_quota_per_teacher
        - max_upload_size_mb
      properties:
        max_classes_per_teacher:
          type: integer
          example: 10
        max_students_per_class:
          type: integer
          example: 60
        gemini_ai_daily_quota_per_teacher:
          type: integer
          example: 30
        max_upload_size_mb:
          type: integer
          example: 20

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: "max_students_per_class"
        issue:
          type: string
          example: "Thông số cấu hình hạn mức phải là số nguyên dương"

    ErrorResponse:
      type: object
      required:
        - success
        - status_code
        - message
        - error_code
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 403
        message:
          type: string
          example: "Bạn không có quyền truy cập vào chức năng này"
        error_code:
          type: string
          example: "AUTH_ROLE_FORBIDDEN"
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          example: "2026-09-27T08:30:00.000Z"

  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ hoặc tài khoản đã ở trạng thái này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc Token quản trị viên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Từ chối truy cập - Yêu cầu tài khoản có vai trò ADMIN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy người dùng hoặc tài nguyên yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Dữ liệu gửi lên sai định dạng validation DTO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
