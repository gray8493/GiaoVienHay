openapi: 3.0.3
info:
  title: GiaoVienHay - Fees & Insurance Management API
  version: 1.0.0
  description: Đặc tả API phân hệ Quản lý thu nộp Học phí & Bảo hiểm y tế (BHYT) của học sinh (Theo dõi qua 2 cờ boolean kèm ngày nộp thực tế, không có cổng thanh toán online).
servers:
  - url: /api/v1
    description: Production API Server
paths:
  /fees-insurance/class/{classId}:
    get:
      summary: GVCN xem danh sách thu nộp Học phí & BHYT của lớp
      tags:
        - Fees & Insurance
      security:
        - BearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
        - name: fee_type
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, TUITION, INSURANCE]
            default: ALL
        - name: unpaid_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Danh sách thu nộp học phí và BHYT của lớp
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      class_id:
                        type: string
                      term_name:
                        type: string
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassFeeRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /fees-insurance/toggle:
    patch:
      summary: Cập nhật cờ đã nộp kèm ngày nộp thực tế (GVCN)
      tags:
        - Fees & Insurance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - record_id
                - fee_type
                - is_paid
              properties:
                record_id:
                  type: string
                  example: "fee_02"
                fee_type:
                  type: string
                  enum: [TUITION, INSURANCE]
                  example: "INSURANCE"
                is_paid:
                  type: boolean
                  example: true
                paid_date:
                  type: string
                  format: date
                  example: "2026-09-23"
                  description: Ngày nộp thực tế (YYYY-MM-DD)
                note:
                  type: string
                  example: "Đã nộp tiền mặt tại lớp"
      responses:
        '200':
          description: Cập nhật trạng thái nộp tiền thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Cập nhật trạng thái nộp tiền thành công"
                  data:
                    type: object
                    properties:
                      record_id:
                        type: string
                      is_paid:
                        type: boolean
                      paid_date:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /fees-insurance/remind:
    post:
      summary: Gửi thông báo đẩy FCM nhắc các phụ huynh chưa nộp Học phí hoặc BHYT
      tags:
        - Fees & Insurance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - class_id
                - fee_type
              properties:
                class_id:
                  type: string
                  example: "cls_1a_2026"
                fee_type:
                  type: string
                  enum: [TUITION, INSURANCE, BOTH]
                  example: "INSURANCE"
                custom_message:
                  type: string
                  example: "Kính nhờ quý phụ huynh chưa hoàn thành BHYT năm học 2026-2027 vui lòng nộp trước ngày 15/10."
      responses:
        '200':
          description: Đã gửi lời nhắc thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã gửi thông báo nhắc nhở tới 12 phụ huynh chưa nộp"
                  data:
                    type: object
                    properties:
                      class_id:
                        type: string
                      notified_parents_count:
                        type: integer
                        example: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClassFeeRecord:
      type: object
      properties:
        record_id:
          type: string
        student_id:
          type: string
        student_name:
          type: string
        tuition:
          type: object
          properties:
            is_paid:
              type: boolean
            paid_date:
              type: string
              nullable: true
        insurance:
          type: object
          properties:
            is_paid:
              type: boolean
            paid_date:
              type: string
              nullable: true
        note:
          type: string
          nullable: true

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: "is_paid"
        issue:
          type: string
          example: "Trạng thái nộp phí phải là boolean (true/false)"

    ErrorResponse:
      type: object
      required:
        - success
        - status_code
        - message
        - error_code
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 404
        message:
          type: string
          example: "Không tìm thấy bản ghi theo dõi học phí hoặc BHYT"
        error_code:
          type: string
          example: "FEE_RECORD_NOT_FOUND"
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          example: "2026-09-27T08:30:00.000Z"

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ hoặc đợt thu đã kết thúc
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc Token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền quản lý BHYT/học phí lớp học này (chỉ dành cho GVCN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy bản ghi học phí/BHYT hoặc lớp học
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Sai định dạng dữ liệu đầu vào DTO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
