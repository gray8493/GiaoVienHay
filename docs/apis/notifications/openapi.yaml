openapi: 3.0.3
info:
  title: GiaoVienHay - Push Notifications Log API
  version: 1.0.0
  description: Đặc tả API phân hệ Quản lý lịch sử thông báo đẩy FCM (Xem danh sách, đếm chưa đọc, đánh dấu đã đọc).
servers:
  - url: /api/v1
    description: Production API Server
paths:
  /notifications:
    get:
      summary: Lấy danh sách lịch sử thông báo của tài khoản
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: is_read
          in: query
          required: false
          schema:
            type: boolean
          description: Lọc theo trạng thái đã đọc (true/false)
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      unread_count:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 15
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationItem'

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã đánh dấu đọc thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã đánh dấu thông báo là đã đọc"

  /notifications/read-all:
    patch:
      summary: Đánh dấu toàn bộ thông báo của tài khoản là đã đọc
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Đã đánh dấu tất cả là đã đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã đánh dấu toàn bộ thông báo là đã đọc"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NotificationItem:
      type: object
      properties:
        id:
          type: string
          example: "notif_01"
        title:
          type: string
          example: "Nhắc lịch kiểm tra môn Toán"
        body:
          type: string
          example: "Thứ Sáu tới lớp có bài kiểm tra 15 phút Toán. Kính nhờ phụ huynh đôn đốc con ôn bài."
        type:
          type: string
          enum: [ATTENDANCE_ABSENT, GRADE_PUBLISHED, REMARK_NEW, EXAM_REMINDER, FEE_REMINDER, SYSTEM]
          example: "EXAM_REMINDER"
        is_read:
          type: boolean
          example: false
        metadata:
          type: object
          properties:
            student_id:
              type: string
            screen:
              type: string
        created_at:
          type: string
          format: date-time
