openapi: 3.0.3
info:
  title: GiaoVienHay - Push Notifications Log API
  version: 1.0.0
  description: Đặc tả API phân hệ Quản lý lịch sử thông báo đẩy FCM (Xem danh sách, đếm chưa đọc, đánh dấu đã đọc).
servers:
  - url: /api/v1
    description: Production API Server
paths:
  /notifications:
    get:
      summary: Lấy danh sách lịch sử thông báo của tài khoản
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: is_read
          in: query
          required: false
          schema:
            type: boolean
          description: Lọc theo trạng thái đã đọc (true/false)
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      unread_count:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 15
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã đánh dấu đọc thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã đánh dấu thông báo là đã đọc"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/read-all:
    patch:
      summary: Đánh dấu toàn bộ thông báo của tài khoản là đã đọc
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Đã đánh dấu tất cả là đã đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã đánh dấu toàn bộ thông báo là đã đọc"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NotificationItem:
      type: object
      properties:
        id:
          type: string
          example: "notif_01"
        title:
          type: string
          example: "Nhắc lịch kiểm tra môn Toán"
        body:
          type: string
          example: "Thứ Sáu tới lớp có bài kiểm tra 15 phút Toán. Kính nhờ phụ huynh đôn đốc con ôn bài."
        type:
          type: string
          enum: [ATTENDANCE_ABSENT, GRADE_PUBLISHED, REMARK_NEW, EXAM_REMINDER, FEE_REMINDER, SYSTEM]
          example: "EXAM_REMINDER"
        is_read:
          type: boolean
          example: false
        metadata:
          type: object
          properties:
            student_id:
              type: string
            screen:
              type: string
        created_at:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: "id"
        issue:
          type: string
          example: "Không tìm thấy thông báo trong hộp thư"

    ErrorResponse:
      type: object
      required:
        - success
        - status_code
        - message
        - error_code
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 404
        message:
          type: string
          example: "Không tìm thấy thông báo"
        error_code:
          type: string
          example: "NOTI_NOT_FOUND"
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          example: "2026-09-27T08:30:00.000Z"

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc Token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy thông báo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
