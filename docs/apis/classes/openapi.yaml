openapi: 3.0.3
info:
  title: GiaoVienHay - Classes API
  description: Đặc tả OpenAPI cho Phân hệ Quản lý Lớp học tổng, Phân công GVBM & Mã mời Phụ huynh
  version: 1.0.0
servers:
  - url: https://api.giaovienhay.vn/api/v1
    description: Production Server
  - url: http://localhost:3000/api/v1
    description: Local Dev Server

tags:
  - name: Classes
    description: GVCN tạo lớp tổng, gán GVBM, sinh link mời và quản lý thành viên

paths:
  /classes:
    post:
      tags:
        - Classes
      summary: GVCN tạo Lớp học tổng, thêm học sinh & phân công GVBM
      operationId: createClass
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassDto'
      responses:
        '201':
          description: Tạo lớp thành công kèm Invite Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Classes
      summary: Lấy danh sách lớp giáo viên đang phụ trách (chủ nhiệm + dạy bộ môn)
      operationId: getMyClasses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách lớp học
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{id}:
    get:
      tags:
        - Classes
      summary: Xem chi tiết thông tin lớp học, sĩ số và danh sách GVBM
      operationId: getClassById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết lớp học
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{id}/my-subject:
    get:
      tags:
        - Classes
      summary: GVBM truy cập lớp tổng theo môn học mình phụ trách
      operationId: getMySubjectInClass
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trả về danh sách học sinh và quyền hạn nhập điểm môn được phân công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{id}/invite:
    get:
      tags:
        - Classes
      summary: Lấy mã mời (invite_code), link mời và mã QR của lớp
      operationId: getClassInviteInfo
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin mời tham gia lớp
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/join:
    post:
      tags:
        - Classes
      summary: Phụ huynh tham gia lớp học qua mã mời và xác nhận con em mình
      operationId: joinClassByInvite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invite_code
                - student_id
              properties:
                invite_code:
                  type: string
                  example: GVH1A26
                student_id:
                  type: string
                  example: stu_01
      responses:
        '200':
          description: Liên kết vào lớp của con thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{id}/students:
    post:
      tags:
        - Classes
      summary: GVCN thêm học sinh đơn lẻ hoặc import từ file Excel
      operationId: addStudentsToClass
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                students:
                  type: array
                  items:
                    $ref: '#/components/schemas/StudentInputDto'
      responses:
        '201':
          description: Thêm học sinh vào lớp thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{id}/students/{studentId}:
    delete:
      tags:
        - Classes
      summary: GVCN xóa học sinh khỏi lớp
      operationId: removeStudentFromClass
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã xóa học sinh khỏi lớp thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{id}/subject-teachers:
    put:
      tags:
        - Classes
      summary: GVCN cập nhật hoặc gán lại Giáo viên Bộ môn (GVBM) cho lớp
      operationId: updateSubjectTeachers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject_teachers
              properties:
                subject_teachers:
                  type: array
                  items:
                    type: object
                    required:
                      - teacher_id
                      - subject_code
                    properties:
                      teacher_id:
                        type: string
                        example: "usr_gvbm_math"
                      subject_code:
                        type: string
                        example: "MATH"
      responses:
        '200':
          description: Cập nhật phân công GVBM thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateClassDto:
      type: object
      required:
        - name
        - grade_level
        - academic_year
      properties:
        name:
          type: string
          example: 1A
        grade_level:
          type: integer
          minimum: 1
          maximum: 9
          example: 1
        academic_year:
          type: string
          example: 2026-2027
        subject_teachers:
          type: array
          items:
            type: object
            properties:
              teacher_id:
                type: string
              subject_code:
                type: string
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentInputDto'

    StudentInputDto:
      type: object
      required:
        - student_code
        - full_name
        - gender
      properties:
        student_code:
          type: string
          example: HS001
        full_name:
          type: string
          example: Trần Bảo Nam
        gender:
          type: string
          enum: [MALE, FEMALE]
          example: MALE
        dob:
          type: string
          format: date
          example: 2020-05-15

    ClassDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            class_id:
              type: string
            name:
              type: string
            grade_level:
              type: integer
            invite_code:
              type: string
            invite_link:
              type: string
            total_students:
              type: integer

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: "invite_code"
        issue:
          type: string
          example: "Mã mời tham gia lớp học không hợp lệ hoặc đã hết hạn"

    ErrorResponse:
      type: object
      required:
        - success
        - status_code
        - message
        - error_code
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 400
        message:
          type: string
          example: "Yêu cầu không hợp lệ"
        error_code:
          type: string
          example: "CLASS_INVITE_CODE_INVALID"
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          example: "2026-09-27T08:30:00.000Z"

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ hoặc vi phạm quy tắc lớp học
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc Token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền GVCN hoặc quyền truy cập lớp học này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy lớp học hoặc mã mời
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột mã học sinh hoặc phụ huynh đã liên kết con
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Sai quy chuẩn dữ liệu đầu vào DTO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
